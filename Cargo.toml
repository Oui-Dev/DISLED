#
# Rust workspace: the protocol codec shared by the desktop app and the
# production tool.
[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/disled-protocol"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Oui-Dev/DISLED"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
