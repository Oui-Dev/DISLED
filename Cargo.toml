#
# Rust workspace of the desktop app, the production tool and the two crates
# they share, the protocol codec and the flashing code.
[workspace]
resolver = "3"
members = [
    "app/src-tauri",
    "crates/disled-flash",
    "crates/disled-protocol",
    "tools/disled-factory",
]

[workspace.package]
authors = ["The DISLED contributors"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Oui-Dev/DISLED"
publish = false

[workspace.dependencies]
disled-flash = { path = "crates/disled-flash" }
disled-protocol = { path = "crates/disled-protocol" }
hidapi = "^2.6.7"
semver = "^1.0.28"
serde = "^1.0.229"
serde_json = "^1.0.154"
ts-rs = "^12.0.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
