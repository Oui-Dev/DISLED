[package]
name = "disled-protocol"
description = "DISLED USB HID protocol codec (protocol/README.md)"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TypeScript types of the serialized types, written by ts-rs for the desktop
# app.
ts = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = "2"
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
