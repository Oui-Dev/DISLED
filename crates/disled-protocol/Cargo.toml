[package]
name = "disled-protocol"
description = "DISLED USB HID protocol codec (protocol/README.md)"
authors = ["The DISLED contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TypeScript types of the serialized types, written by ts-rs for the desktop
# app.
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ts-rs = { version = "12", optional = true }

[dev-dependencies]
serde_json = "1"
