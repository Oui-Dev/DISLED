[package]
name = "disled-flash"
description = "Flashing a DISLED lamp: the signed firmware files and the wchisp flasher, run as a separate program"
authors = ["The DISLED contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TypeScript types of the serialized types (ts-rs), for the desktop app.
ts = ["dep:ts-rs"]

[dependencies]
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
serde_json = "1"
