[package]
name = "disled-flash"
description = "Flashing a DISLED lamp: the signed firmware files and the wchisp flasher, run as a separate program"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# TypeScript types of the serialized types, written by ts-rs for the desktop
# app.
ts = ["dep:ts-rs"]

[dependencies]
base64 = "0.22"
minisign-verify = "0.3"
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
