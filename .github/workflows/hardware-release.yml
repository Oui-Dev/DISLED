#
# Hardware releases (docs/releasing.md, ADR 0019), run by hand on main: the
# PCB or the enclosure, which release-please leaves alone. The release gets
# the files of hardware/<design>/ but its changelog and, as notes, the
# section of that changelog for the version. Like the other releases it is
# drafted, then published complete (ADR 0015), and never as the "latest"
# one: that one is the app's, where the updater looks.
name: hardware release

on:
  workflow_dispatch:
    inputs:
      design:
        description: Design
        type: choice
        options: [pcb, enclosure]
      version:
        description: Version, as in the changelog of the design (X.Y.Z)
        type: string
        required: true
      prerelease:
        description: Pre-release (a design that will not be manufactured)
        type: boolean
        default: false
  # The designs released after the fact (hardware-backfill.yml).
  workflow_call:
    inputs:
      design:
        type: string
        required: true
      version:
        type: string
        required: true
      prerelease:
        type: boolean
        default: false
      # The workflow token may not tag a commit whose workflow files differ
      # from main's (HTTP 403): push the tag of such a commit by hand first.
      ref:
        description: Commit to tag and to take the files from, instead of the one that runs
        type: string
        default: ""
      files:
        description: Files at that commit, separated by spaces, each as path or path=published name
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      DESIGN: ${{ inputs.design }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.design }}-v${{ inputs.version }}
      REF: ${{ inputs.ref || github.sha }}
      FILES: ${{ inputs.files }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, and the files of an older commit

      - name: Check the version
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run it on main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not X.Y.Z."
            exit 1
          fi
          # A tag pushed by hand (ref input above) must point at the commit.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null &&
            [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse "$REF^{commit}")" ]; then
            echo "::error::$TAG points at another commit."
            exit 1
          fi
          # gh finds the drafts too: delete one left by a failed run.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG already has a release."
            exit 1
          fi

      - name: Notes from the changelog
        run: |
          # From the "## X.Y.Z (date)" heading to the next one.
          awk -v version="$VERSION" '/^## / { if (found) exit; found = ($2 == version) } found' \
            "hardware/$DESIGN/CHANGELOG.md" > notes.md
          if ! [ -s notes.md ]; then
            echo "::error::hardware/$DESIGN/CHANGELOG.md has no $VERSION section."
            exit 1
          fi
          cat notes.md

      - name: Collect the files
        run: |
          if [ -z "$FILES" ]; then
            FILES=$(git ls-tree --name-only "$REF" "hardware/$DESIGN/" | grep -v '/CHANGELOG\.md$')
          fi
          names=()
          for entry in $FILES; do names+=("$(basename "${entry#*=}")"); done
          mkdir dist
          i=0
          for entry in $FILES; do
            name=${names[i]}
            i=$((i + 1))
            ext=${name##*.}
            # The only file of its type is named after the version alone.
            if [ "$(printf '%s\n' "${names[@]}" | grep -c "\.$ext\$")" -eq 1 ]; then
              out="disled-$DESIGN-$VERSION.$ext"
            else
              out="disled-$DESIGN-$VERSION-${name%.*}.$ext"
            fi
            git cat-file blob "$REF:${entry%%=*}" > "dist/$out"
          done
          ls -l dist

      - name: Draft the release
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --draft --target "$REF" \
            --title "$DESIGN: v$VERSION" --notes-file notes.md "${prerelease[@]}"

      - name: Publish the release
        # Never as the "latest" release: that one is the app's.
        run: gh release edit "$TAG" --draft=false --latest=false
