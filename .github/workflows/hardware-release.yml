#
# Hardware releases (docs/releasing.md, ADR 0019), run by hand on main: the
# PCB or the enclosure, which release-please leaves alone. The release tags
# the commit that runs, gets the files of hardware/<design>/ but its
# changelog and, as notes, the section of that changelog for the version.
# Like the other releases it is drafted, then published complete (ADR
# 0015), and never as the "latest" one: that one is the app's, where the
# updater looks.
name: hardware release

on:
  workflow_dispatch:
    inputs:
      design:
        description: Design
        type: choice
        options: [pcb, enclosure]
      version:
        description: Version, as in the changelog of the design (X.Y.Z)
        type: string
        required: true
      prerelease:
        description: Pre-release (a design that will not be manufactured)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      DESIGN: ${{ inputs.design }}
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.design }}-v${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags

      - name: Check the version
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run it on main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$VERSION is not X.Y.Z."
            exit 1
          fi
          # gh finds the drafts too: delete one left by a failed run.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG exists."
            exit 1
          fi

      - name: Notes from the changelog
        run: |
          # From the "## X.Y.Z (date)" heading to the next one.
          awk -v version="$VERSION" '/^## / { if (found) exit; found = ($2 == version) } found' \
            "hardware/$DESIGN/CHANGELOG.md" > notes.md
          if ! [ -s notes.md ]; then
            echo "::error::hardware/$DESIGN/CHANGELOG.md has no $VERSION section."
            exit 1
          fi
          cat notes.md

      - name: Collect the files
        run: |
          files=$(git ls-tree --name-only HEAD "hardware/$DESIGN/" | grep -v '/CHANGELOG\.md$')
          mkdir dist
          for path in $files; do
            name=$(basename "$path")
            ext=${name##*.}
            # The only file of its type is named after the version alone.
            if [ "$(printf '%s\n' $files | grep -c "\.$ext\$")" -eq 1 ]; then
              out="disled-$DESIGN-$VERSION.$ext"
            else
              out="disled-$DESIGN-$VERSION-${name%.*}.$ext"
            fi
            cp "$path" "dist/$out"
          done
          ls -l dist

      - name: Draft the release
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" \
            --title "$DESIGN: v$VERSION" --notes-file notes.md "${prerelease[@]}"

      - name: Publish the release
        # Never as the "latest" release: that one is the app's.
        run: gh release edit "$TAG" --draft=false --latest=false
