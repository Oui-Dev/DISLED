name: firmware

# Checks of the pull requests into main that are ready for review, drafts
# aside. The release workflow makes the release builds.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "firmware/**"
      - "protocol/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

# A new push to the pull request cancels the checks of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  firmware:
    if: ${{ !github.event.pull_request.draft }}
    # The runner of the release build, so the same compiler.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0 # git describe needs the tags for the version

      # uv version from pyproject.toml, Python from .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: firmware

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install tools
        run: uv sync --locked

      - name: Format
        run: uv run clang-format --dry-run --Werror $(git ls-files 'lib/disled_core/*.[ch]' 'src/*.[ch]' 'test/*.c' 'tools/*.c')

      - name: Unit tests (host)
        run: uv run pio test -e native

      - name: Build debug and release
        run: uv run pio run -e debug -e release

      # The platform picks the compiler per OS and platformio.ini cannot pin
      # it, so the log shows which one built.
      - name: Toolchain version
        run: ~/.platformio/packages/toolchain-riscv/bin/riscv-wch-elf-gcc --version | head -n 1

      - name: Static analysis
        run: uv run pio check -e debug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/.pio/build/debug/firmware.bin
            firmware/.pio/build/debug/firmware.hex
            firmware/.pio/build/debug/firmware.elf
            firmware/.pio/build/debug/firmware.map
            firmware/.pio/build/release/firmware.bin
            firmware/.pio/build/release/firmware.hex
            firmware/.pio/build/release/firmware.elf
            firmware/.pio/build/release/firmware.map
          if-no-files-found: error
