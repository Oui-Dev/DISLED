name: firmware

# Checks of the pull requests into main that are ready for review (not
# drafts). Release builds come from the release workflow.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "firmware/**"
      - "protocol/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

# A new push to the pull request cancels the checks of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  firmware:
    if: ${{ !github.event.pull_request.draft }}
    # Linux runners only: their minutes are the cheapest on a private repo.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # git describe needs the tags for the version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install tools
        run: pip install platformio==6.2.0 clang-format==23.1.3

      - name: Format
        run: clang-format --dry-run --Werror $(git ls-files 'lib/disled_core/*.[ch]' 'src/*.[ch]' 'test/*.c' 'tools/*.c')

      - name: Unit tests (host)
        run: pio test -e native

      - name: Build debug and release
        run: pio run -e debug -e release

      # The platform picks the compiler per OS; it cannot be pinned (ADR 0008).
      - name: Toolchain version
        run: ~/.platformio/packages/toolchain-riscv/bin/riscv-wch-elf-gcc --version | head -n 1

      - name: Static analysis
        run: pio check -e debug

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/.pio/build/debug/firmware.bin
            firmware/.pio/build/debug/firmware.hex
            firmware/.pio/build/debug/firmware.elf
            firmware/.pio/build/debug/firmware.map
            firmware/.pio/build/release/firmware.bin
            firmware/.pio/build/release/firmware.hex
            firmware/.pio/build/release/firmware.elf
            firmware/.pio/build/release/firmware.map
          if-no-files-found: error
