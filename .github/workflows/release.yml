# SPDX-FileCopyrightText: 2026 The DISLED contributors
#
# Releases (docs/releasing.md, ADR 0015). On every push to main,
# release-please keeps the release pull request up to date. Merging it
# tags fw-vX.Y.Z and/or app-vX.Y.Z and creates draft releases, visible to
# the maintainers only. The jobs below build those tags, attach the
# binaries, and publish each release only once it is complete: published
# releases are immutable (repository setting). The app release is
# published as the "latest" one and a firmware release never is: the app
# updater reads releases/latest/download/latest.json.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The flasher shipped with the app for the lamp updates (ADR 0016). The
  # app reads its messages (crates/disled-flash/src/wchisp.rs), and its
  # notice names the version (app/src-tauri/third-party/wchisp): check
  # both before changing it.
  WCHISP_VERSION: 0.3.0

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      firmware-released: ${{ steps.release.outputs['firmware--release_created'] }}
      firmware-tag: ${{ steps.release.outputs['firmware--tag_name'] }}
      app-released: ${{ steps.release.outputs['app--release_created'] }}
      app-tag: ${{ steps.release.outputs['app--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  firmware:
    needs: release-please
    if: needs.release-please.outputs.firmware-released == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release-please.outputs.firmware-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          submodules: true
          fetch-depth: 0 # the build takes its version from the tag

      # uv version from pyproject.toml, Python from .python-version.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: firmware

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build
        working-directory: firmware
        run: |
          uv sync --locked
          uv run pio test -e native
          uv run pio run -e debug -e release

      # For the signature below: the Tauri CLI of the app.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Attach to the draft release
        working-directory: firmware
        env:
          # The app installs only firmware signed with the update key, the
          # version included (ADR 0016).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${TAG#fw-v}"
          mkdir dist
          for build in release debug; do
            suffix=$([ "$build" = debug ] && echo "-debug" || true)
            for ext in hex bin elf; do
              cp ".pio/build/$build/firmware.$ext" "dist/disled-fw-$version$suffix.$ext"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cli=$(node -p 'require("../app/package-lock.json").packages["node_modules/@tauri-apps/cli"].version')
          npx --yes "@tauri-apps/cli@$cli" signer sign --app-version "$version" "dist/disled-fw-$version.hex"
          gh release upload "$TAG" dist/* --clobber

      - name: Publish the release
        # Never as the "latest" release: that one is the app's.
        run: gh release edit "$TAG" --draft=false --latest=false

  app:
    needs: release-please
    if: needs.release-please.outputs.app-released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
          - os: macos-14 # Apple Silicon
            bundles: app,dmg # the updater archive is made from the app bundle
          - os: ubuntu-22.04 # oldest supported glibc: the .deb installs on older systems too
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.app-tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Tauri and hidapi system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Rust workspace at the repository root.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The lamp updates flash with wchisp, a GPL-2.0 program shipped next
      # to the app, never linked (ADR 0016). Tauri wants it named after the
      # target.
      - name: wchisp
        env:
          # Like the app: no dependency on the Visual C++ runtime DLLs.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo install "wchisp@$WCHISP_VERSION" --locked --root "$RUNNER_TEMP/wchisp"
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          mkdir -p src-tauri/binaries
          cp "$RUNNER_TEMP/wchisp/bin/wchisp$ext" "src-tauri/binaries/wchisp-$triple$ext"

      - name: Build the installer
        env:
          # Signs the installers for the app updater (docs/releasing.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }} \
            --config src-tauri/tauri.updater.conf.json \
            --config src-tauri/tauri.wchisp.conf.json

      # Apple Silicon calls an app downloaded without any signature
      # "damaged" and offers only the bin (issue #19): the bundle, wchisp
      # included, must carry the ad-hoc signature of tauri.conf.json.
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        working-directory: target/release/bundle/macos
        run: codesign --verify --deep --strict --verbose=2 DISLED.app

      - name: Attach to the draft release
        working-directory: target/release/bundle
        run: |
          # The macOS updater archive has neither version nor architecture
          # in its name.
          if [ -f macos/DISLED.app.tar.gz ]; then
            for ext in "" .sig; do
              mv "macos/DISLED.app.tar.gz$ext" "macos/DISLED_${TAG#app-v}_aarch64.app.tar.gz$ext"
            done
          fi
          find . -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -print0 | xargs -0 gh release upload "$TAG" --clobber

  app-publish:
    # Only once every installer is attached: a published release can no
    # longer change. If one platform failed, re-run it: this job follows.
    needs: [release-please, app]
    if: needs.release-please.outputs.app-released == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release-please.outputs.app-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Attach the wchisp source and notice
        # GPL-2.0: the source of the wchisp in the installers goes with
        # them. The crates.io package that `cargo install` built, checked
        # against the checksum of the crates.io index.
        run: |
          crate="wchisp-$WCHISP_VERSION.crate"
          curl -fsSL -o "$crate" "https://static.crates.io/crates/wchisp/$crate"
          checksum=$(curl -fsSL https://index.crates.io/wc/hi/wchisp |
            jq -r --arg version "$WCHISP_VERSION" 'select(.vers == $version) | .cksum')
          echo "$checksum  $crate" | sha256sum --check
          mkdir wchisp
          mv "$crate" "wchisp/wchisp-$WCHISP_VERSION-source.tar.gz"
          cp app/src-tauri/third-party/wchisp/README.md wchisp/wchisp-NOTICE.md
          gh release upload "$TAG" wchisp/* --clobber

      - name: Attach latest.json
        run: |
          mkdir signatures
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          gh release view "$TAG" --json body --jq .body > notes.md
          node app/scripts/updater-manifest.mjs "${TAG#app-v}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            signatures notes.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
