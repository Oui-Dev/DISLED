#
# Releases (docs/releasing.md). On every push to main, release-please keeps
# one release pull request per component up to date. Merging it tags
# fw-vX.Y.Z or app-vX.Y.Z and publishes the GitHub release; the jobs below
# then build that tag and attach the binaries.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      firmware-released: ${{ steps.release.outputs['firmware--release_created'] }}
      firmware-tag: ${{ steps.release.outputs['firmware--tag_name'] }}
      app-released: ${{ steps.release.outputs['app--release_created'] }}
      app-tag: ${{ steps.release.outputs['app--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  firmware:
    needs: release-please
    if: needs.release-please.outputs.firmware-released == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release-please.outputs.firmware-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          submodules: true
          fetch-depth: 0 # the build takes its version from the tag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build
        working-directory: firmware
        run: |
          pip install platformio==6.2.0
          pio test -e native
          pio run -e debug -e release

      - name: Attach to the release
        working-directory: firmware
        run: |
          version="${TAG#fw-v}"
          mkdir dist
          for build in release debug; do
            suffix=$([ "$build" = debug ] && echo "-debug" || true)
            for ext in hex bin elf; do
              cp ".pio/build/$build/firmware.$ext" "dist/disled-fw-$version$suffix.$ext"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber

  app:
    needs: release-please
    if: needs.release-please.outputs.app-released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
          - os: macos-14 # Apple Silicon
            bundles: dmg
          - os: ubuntu-22.04 # oldest glibc still supported, for the AppImage
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.app-tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tauri and hidapi system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build the installer
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Attach to the release
        run: |
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -print0 | xargs -0 gh release upload "$TAG" --clobber
