# SPDX-FileCopyrightText: 2026 The DISLED contributors
#
# Releases (docs/releasing.md, ADR 0015). On every push to main,
# release-please keeps the release pull request up to date. Merging it
# tags fw-vX.Y.Z and/or app-vX.Y.Z and creates draft releases, visible to
# the maintainers only. The jobs below build those tags, attach the
# binaries, and publish each release only once it is complete: published
# releases are immutable (repository setting). The app release is
# published as the "latest" one and a firmware release never is: the app
# updater reads releases/latest/download/latest.json.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      firmware-released: ${{ steps.release.outputs['firmware--release_created'] }}
      firmware-tag: ${{ steps.release.outputs['firmware--tag_name'] }}
      app-released: ${{ steps.release.outputs['app--release_created'] }}
      app-tag: ${{ steps.release.outputs['app--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  firmware:
    needs: release-please
    if: needs.release-please.outputs.firmware-released == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release-please.outputs.firmware-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          submodules: true
          fetch-depth: 0 # the build takes its version from the tag

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build
        working-directory: firmware
        run: |
          pip install -r requirements.txt
          pio test -e native
          pio run -e debug -e release

      - name: Attach to the draft release
        working-directory: firmware
        run: |
          version="${TAG#fw-v}"
          mkdir dist
          for build in release debug; do
            suffix=$([ "$build" = debug ] && echo "-debug" || true)
            for ext in hex bin elf; do
              cp ".pio/build/$build/firmware.$ext" "dist/disled-fw-$version$suffix.$ext"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber

      - name: Publish the release
        # Never as the "latest" release: that one is the app's.
        run: gh release edit "$TAG" --draft=false --latest=false

  app:
    needs: release-please
    if: needs.release-please.outputs.app-released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
          - os: macos-14 # Apple Silicon
            bundles: app,dmg # the updater archive is made from the app bundle
          - os: ubuntu-22.04 # oldest supported glibc: the .deb installs on older systems too
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.app-tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Tauri and hidapi system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2 # Rust workspace at the repository root

      - name: Build the installer
        env:
          # Signs the installers for the app updater (docs/releasing.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }} \
            --config src-tauri/tauri.updater.conf.json

      - name: Attach to the draft release
        working-directory: target/release/bundle
        run: |
          # The macOS updater archive has neither version nor architecture
          # in its name.
          if [ -f macos/DISLED.app.tar.gz ]; then
            for ext in "" .sig; do
              mv "macos/DISLED.app.tar.gz$ext" "macos/DISLED_${TAG#app-v}_aarch64.app.tar.gz$ext"
            done
          fi
          find . -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -print0 | xargs -0 gh release upload "$TAG" --clobber

  app-publish:
    # Only once every installer is attached: a published release can no
    # longer change. If one platform failed, re-run it: this job follows.
    needs: [release-please, app]
    if: needs.release-please.outputs.app-released == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.release-please.outputs.app-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Attach latest.json
        run: |
          mkdir signatures
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          gh release view "$TAG" --json body --jq .body > notes.md
          node app/scripts/updater-manifest.mjs "${TAG#app-v}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            signatures notes.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
