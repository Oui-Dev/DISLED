name: app

on:
  push:
    paths:
      - "app/**"
      - "protocol/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "protocol/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

jobs:
  app:
    # Checks only. Installers (Windows and macOS runners) come in phase 2.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Tauri and hidapi system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Front end
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build

      - name: Back end
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
