version: 2
# Commit messages follow Conventional Commits, which release-please reads
# (docs/releasing.md). fix(deps) releases the component it touches;
# chore(deps-dev), build(deps) and ci(deps) release nothing.
updates:
  # APP dependencies: front end and Tauri CLI
  - package-ecosystem: 'npm'
    directory: '/app/'
    schedule:
      interval: 'weekly'
      timezone: 'UTC'
    target-branch: 'main'
    open-pull-requests-limit: 8
    commit-message:
      prefix: 'fix'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'type:dependencies'
      - 'service:app'
    # Shipped and development dependencies apart, so that a tooling update
    # does not release the app.
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      production:
        applies-to: version-updates
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development:
        applies-to: version-updates
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  # APP back end and shared crates, the Rust workspace at the root. An
  # update of Cargo.lock alone belongs to no component and goes out with the
  # next app release.
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
      timezone: 'UTC'
    target-branch: 'main'
    open-pull-requests-limit: 8
    commit-message:
      prefix: 'fix'
      include: 'scope'
    labels:
      - 'type:dependencies'
      - 'service:app'
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  # FIRMWARE build and check tools, PlatformIO and clang-format, through uv
  # in pyproject.toml and uv.lock. platformio.ini pins the PlatformIO
  # platform and the SDK by commit, and TinyUSB follows its releases by hand;
  # Dependabot reads neither.
  - package-ecosystem: 'uv'
    directory: '/firmware/'
    schedule:
      interval: 'weekly'
      timezone: 'UTC'
    target-branch: 'main'
    commit-message:
      prefix: 'build'
      include: 'scope'
    labels:
      - 'type:dependencies'
      - 'service:firmware'

  # CI dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      timezone: 'UTC'
    target-branch: 'main'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'type:dependencies'
      - 'service:ci'
