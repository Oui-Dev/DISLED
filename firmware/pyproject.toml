#
# Build and check tools of the firmware, at the versions the CI uses:
# `uv sync` installs them in .venv, `uv run pio ...` runs them. uv.lock pins
# every package; Dependabot keeps both files up to date. With no
# [build-system], uv installs only the tools, never this project. The
# format requires a version; the firmware version itself comes from git
# tags (scripts/version.py), not from here.

[project]
name = "disled-firmware-tools"
version = "0.0.0"
description = "Build and check tools of the DISLED firmware"
requires-python = ">=3.14"
dependencies = [
    "platformio==6.2.0",
    "clang-format==23.1.3",
]

[tool.uv]
required-version = ">=0.13"
