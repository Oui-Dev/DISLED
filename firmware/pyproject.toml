#
# Build and check tools of the firmware, at the versions the CI uses:
# `uv sync` installs them in .venv, `uv run pio ...` runs them. uv.lock pins
# every package; Dependabot keeps both files up to date. The firmware
# version itself comes from git tags (scripts/version.py), not from here.

[project]
name = "disled-firmware-tools"
version = "0.0.0"
description = "Build and check tools of the DISLED firmware"
requires-python = ">=3.14"
dependencies = [
    "platformio==6.2.0",
    "clang-format==23.1.3",
]

[tool.uv]
# Tools only: there is no Python package to build.
package = false
required-version = ">=0.13"
