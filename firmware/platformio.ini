;
; Build environments:
;   debug    development firmware: HID + CDC console and logs (default)
;   release  production firmware: HID only, no logs
;   native   unit tests of lib/disled_core on the build machine (run in CI)

[platformio]
default_envs = debug

; Settings shared by the two firmware environments.
[firmware]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#afe523b090566de3c8f3f21c807bde0cbdfa21da
platform_packages =
    framework-wch-noneos-sdk @ https://github.com/Community-PIO-CH32V/framework-wch-noneos-sdk.git#4ba4a2665b6263564fd4ac8d9f58ba433532d4e2
board = genericCH32V203G6U6
framework = noneos-sdk
; The startup code leaves the chip on its internal oscillator. bsp_init()
; then starts the 8 MHz crystal and the PLL (x 18 = 144 MHz, USB needs the
; crystal) with bounded waits, as after a USB suspend.
board_build.clock_source = hsi
; No UART on this board, and the firmware is C only.
board_build.use_builtin_debug_code = no
board_build.cpp_support = no
board_build.use_lto = yes
; Flashing through the WCH ROM bootloader: hold BOOT, press RESET.
upload_protocol = isp
build_unflags = -std=gnu99
build_flags =
    -std=gnu11
    -Isrc
    -Isrc/usb
    -DCFG_TUSB_MCU=OPT_MCU_CH32V20X
    -DCFG_TUD_WCH_USBIP_FSDEV=1
; Strict warnings on our own sources only (not on the SDK or TinyUSB).
build_src_flags =
    -Wextra
    -Werror
    -Wshadow
    -Wdouble-promotion
    -Wformat=2
    -Wmissing-prototypes
    -Wstrict-prototypes
    -Wvla
extra_scripts =
    pre:scripts/version.py
    post:scripts/size_budget.py
    post:scripts/ihex.py
; Static analysis of our own code (pio check), not of the SDK or TinyUSB.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<lib/disled_core/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression
check_severity = low, medium, high

[env:debug]
extends = firmware
build_flags =
    ${firmware.build_flags}
    -DDISLED_DEBUG=1

[env:release]
extends = firmware
build_flags =
    ${firmware.build_flags}
    -DDISLED_DEBUG=0

[env:native]
platform = native@1.2.1
test_framework = unity
lib_ignore = tinyusb
; Protocol test vectors (protocol/vectors/v1.json) -> C header.
extra_scripts = pre:scripts/gen_vectors.py
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wconversion
    -Wno-sign-conversion
