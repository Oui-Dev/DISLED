[package]
name = "disled-app"
# No version here: the app version lives in package.json, where release-please
# bumps it, and tauri.conf.json reads it from there.
description = "Desktop app for the DISLED USB status light"
authors = ["The DISLED contributors"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (https://github.com/rust-lang/cargo/issues/8519).
name = "disled_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disled-protocol = { path = "../../crates/disled-protocol" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
