[package]
name = "disled-app"
# No version here: the app version lives in package.json, where release-please
# bumps it, and tauri.conf.json reads it from there.
description = "Desktop app for the DISLED USB status light"
authors = ["The DISLED contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Oui-Dev/DISLED"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (https://github.com/rust-lang/cargo/issues/8519).
name = "disled_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
